global:
  imageRegistry: ""

replicas: 1

image:
  registry: docker.io
  repository: paskalmaksim/ingress-default-backend
  tag: v0.1.1
  pullPolicy: IfNotPresent

pdb:
  enabled: false
  maxUnavailable: 1

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# extra container args, for example:
#   - -shutdown.delay=5s
#   - -shutdown.timeout=10s
args: []

# must be greater than the shutdown timeout plus the shutdown delay
terminationGracePeriodSeconds: 30

# optional container lifecycle, for example:
# lifecycle:
#   preStop:
#     exec:
#       command: ["sleep", "5"]
lifecycle: {}

resources:
  requests:
    cpu: 20m
    memory: 100Mi

topologySpreadConstraints: {}
# - maxSkew: 1
#   topologyKey: topology.kubernetes.io/zone
#   whenUnsatisfiable: DoNotSchedule
#   labelSelector:
#     matchLabels:
#       app: ingress-default-backend

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - ingress-default-backend
      topologyKey: kubernetes.io/hostname

tolerations: []
# - key: "kubernetes.azure.com/scalesetpriority"
#   operator: "Equal"
#   value: "spot"
#   effect: "NoSchedule"
